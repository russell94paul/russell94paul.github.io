document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ius:8px;padding:10px 13px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:all .18s;background-image:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\" style-hover=\"background-image:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);border-color:rgba(188,216,255,.5);box-shadow:inset 0 0 0 100px rgba(214,224,240,.14),inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -3px rgba(0,0,0,.7),0 0 20px -6px rgba(124,182,255,.55)\">SIHRE<\u002Fa>\n          <a href=\"#loop\" style=\"cursor:pointer;border:1px solid transparent;border-radius:8px;padding:10px 13px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:all .18s;background-image:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\" style-hover=\"background-image:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);border-color:rgba(188,216,255,.5);box-shadow:inset 0 0 0 100px rgba(214,224,240,.14),inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -3px rgba(0,0,0,.7),0 0 20px -6px rgba(124,182,255,.55)\">Learning&nbsp;loop<\u002Fa>\n          <a href=\"#doctrine\" style=\"cursor:pointer;border:1px solid transparent;border-radius:8px;padding:10px 13px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:all .18s;background-image:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\" style-hover=\"background-image:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);border-color:rgba(188,216,255,.5);box-shadow:inset 0 0 0 100px rgba(214,224,240,.14),inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -3px rgba(0,0,0,.7),0 0 20px -6px rgba(124,182,255,.55)\">Frameworks<\u002Fa>\n          <a href=\"#register\" style=\"cursor:pointer;border:1px solid transparent;border-radius:8px;padding:10px 13px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:all .18s;background-image:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\" style-hover=\"background-image:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);border-color:rgba(188,216,255,.5);box-shadow:inset 0 0 0 100px rgba(214,224,240,.14),inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -3px rgba(0,0,0,.7),0 0 20px -6px rgba(124,182,255,.55)\">Register<\u002Fa>\n          <a href=\"#papers\" style=\"cursor:pointer;border:1px solid transparent;border-radius:8px;padding:10px 13px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:all .18s;background-image:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\" style-hover=\"background-image:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);border-color:rgba(188,216,255,.5);box-shadow:inset 0 0 0 100px rgba(214,224,240,.14),inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -3px rgba(0,0,0,.7),0 0 20px -6px rgba(124,182,255,.55)\">Papers<\u002Fa><\u002Fdiv><button type=\"button\" sc-camel-on-click=\"{{ toggleDetail }}\" aria-pressed=\"{{ detailOn }}\" style=\"cursor:pointer;border:1px solid {{ detailBd }};border-radius:8px;padding:0 14px;min-height:40px;background:{{ detailBg }};color:{{ detailFg }};font-size:13.5px;font-weight:600;white-space:nowrap\" style-hover=\"border-color:rgba(188,216,255,.5)\">{{ detailLabel }}<\u002Fbutton><\u002Fnav>\n\n    <section style=\"padding:70px 0 0\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#a2a7b0;margin-bottom:20px\">RESEARCH · STATUS TRACKED SEPARATELY FROM APPROVAL AND IMPLEMENTATION<\u002Fdiv>\n      <h1 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:52px;line-height:1.03;letter-spacing:-.035em;margin:0 0 20px;max-width:24ch;text-wrap:balance\">The questions, written down before the answers exist.<\u002Fh1>\n      <p style=\"font-size:18.5px;line-height:1.6;color:#bfc4cd;max-width:64ch;margin:0 0 16px;text-wrap:pretty\">A research framework, the loop that feeds findings back into the design, the frameworks that came out of building it, every open question on the register, and the written record — including the drafts.<\u002Fp>\n      <p style=\"font-size:15px;line-height:1.6;color:#8d94a1;max-width:64ch;margin:0 0 34px\">Only one result on this page is measured, SIHRE’s first pre-registered test, and it links to its own page. Where a figure exists it carries its source and date; where it does not, the entry says so.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:10px\">\n        <a href=\"#sihre\" style=\"border:1px solid #232327;border-radius:11px;background:#131316;padding:16px 18px;text-decoration:none\" style-hover=\"border-color:rgba(188,216,255,.5);text-decoration:none;box-shadow:inset 0 0 0 100px rgba(214,224,240,.05)\"><div style=\"font-size:15px;font-weight:600;color:#eceae6;margin-bottom:4px\">SIHRE<\u002Fdiv><div style=\"font-size:12.5px;color:#a2a7b0;line-height:1.45\">The framework, and what is not established about it<\u002Fdiv><\u002Fa>\n        <a href=\"#loop\" style=\"border:1px solid #232327;border-radius:11px;background:#131316;padding:16px 18px;text-decoration:none\" style-hover=\"border-color:rgba(188,216,255,.5);text-decoration:none;box-shadow:inset 0 0 0 100px rgba(214,224,240,.05)\"><div style=\"font-size:15px;font-weight:600;color:#eceae6;margin-bottom:4px\">The learning loop<\u002Fdiv><div style=\"font-size:12.5px;color:#a2a7b0;line-height:1.45\">Six stations from a run to a re-measurement<\u002Fdiv><\u002Fa>\n        <a href=\"#doctrine\" style=\"border:1px solid #232327;border-radius:11px;background:#131316;padding:16px 18px;text-decoration:none\" style-hover=\"border-color:rgba(188,216,255,.5);text-decoration:none;box-shadow:inset 0 0 0 100px rgba(214,224,240,.05)\"><div style=\"font-size:15px;font-weight:600;color:#eceae6;margin-bottom:4px\">Signature frameworks<\u002Fdiv><div style=\"font-size:12.5px;color:#a2a7b0;line-height:1.45\">Framing devices, stated as devices<\u002Fdiv><\u002Fa>\n        <a href=\"#register\" style=\"border:1px solid #232327;border-radius:11px;background:#131316;padding:16px 18px;text-decoration:none\" style-hover=\"border-color:rgba(188,216,255,.5);text-decoration:none;box-shadow:inset 0 0 0 100px rgba(214,224,240,.05)\"><div style=\"font-size:15px;font-weight:600;color:#eceae6;margin-bottom:4px\">The register<\u002Fdiv><div style=\"font-size:12.5px;color:#a2a7b0;line-height:1.45\">Open questions and held contradictions<\u002Fdiv><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sihre\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d\">THE SIHRE FRAMEWORK<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;line-height:1.7;color:#eceae6;flex:0 0 auto;white-space:nowrap;border:1px solid rgba(236,236,240,.4);background:rgba(255,255,255,.04);padding:4px 9px;border-radius:4px\">AUTHORED BY PAUL RUSSELL<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:start;margin-bottom:40px\">\n        <div>\n          <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;line-height:1.04;letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance\">SIHRE is not a layer of <span style=\"font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.03em;white-space:nowrap;margin:0 .14em\"><span style=\"background:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\">CELL<\u002Fspan><span data-wm-slash=\"1\" style=\"color:#bcd8ff;padding:0 .2em;animation:cellosglow 2.9s ease-in-out infinite\">//<\u002Fspan><span style=\"background:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);-webkit-background-clip:text;background-clip:text;color:transparent\">OS<\u002Fspan><\u002Fspan>. It is the proposed cognitive architecture of a single Operative.<\u002Fh2>\n          <p style=\"font-size:17px;line-height:1.68;color:#bfc4cd;margin:0 0 18px;text-wrap:pretty\">It came out of quantitative trading, where a strategy that was right last regime is a liability in this one. Read properly, SIHRE is not an ensemble — it is a <strong style=\"color:#d7d7da;font-weight:600\">governance architecture for adaptive intelligence under non-stationarity<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size:17px;line-height:1.68;color:#bfc4cd;margin:0 0 18px;text-wrap:pretty\">The translation rule is the part people get wrong: SIHRE is not one agent on the team. It is <em style=\"color:#d7d7da\">how an Operative thinks<\u002Fem> — a portfolio of reasoning modalities, a meta-orchestrator choosing between them, trust that varies by context, and uncertainty with the authority to stop the whole thing.<\u002Fp>\n          <p style=\"font-size:17px;line-height:1.68;color:#bfc4cd;margin:0;text-wrap:pretty\"><span style=\"font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.03em;white-space:nowrap;margin:0 .14em\"><span style=\"background:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\">CELL<\u002Fspan><span data-wm-slash=\"1\" style=\"color:#bcd8ff;padding:0 .2em;animation:cellosglow 2.9s ease-in-out infinite\">//<\u002Fspan><span style=\"background:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);-webkit-background-clip:text;background-clip:text;color:transparent\">OS<\u002Fspan><\u002Fspan> is what happened when that governance pattern was pointed at organizations instead of portfolios. Which is why it sits outside the eight-layer stack, not inside it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:26px 28px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d;margin-bottom:18px\">THE CONCEPTUAL SHIFT<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#97979d;margin-bottom:8px\">A standard agent asks one question:<\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:22px;line-height:1.3;color:#f4f4f5;margin-bottom:22px\">“What should I do next?”<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#97979d;margin-bottom:14px\">A SIHRE-derived Operative also asks:<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Which cognitive processes suit this state?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">What do I not know?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Which experts are reliable <em style=\"color:#eceae6\">here<\u002Fem> — and are their errors correlated?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Is more reasoning worth the cost?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Is the disagreement meaningful?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Has the operating regime changed?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">Is my confidence calibrated — and should I abstain?<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#d5d3cd\">What should this outcome change about my future cognition?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.6;color:#cbcbd0\">That turns a fixed loop into an adaptive cognitive system.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;margin-bottom:22px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%)\">\n        <div style=\"padding:16px 24px;background:rgba(255,255,255,.03);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;line-height:1.7;color:#97979d\">THE SIHRE CONTROL LOOP — ONE OPERATIVE, ONE MISSION<\u002Fdiv>\n        <div style=\"padding:30px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#0e0e10;background:linear-gradient(96deg,#dcdce0,#9a9aa2);padding:10px 22px;border-radius:6px;font-weight:600\">MISSION<\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:6px\">EVIDENCE / CURRENT STATE<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:6px\">REGIME INFERENCE<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#cbcbd0;border:1px solid rgba(210,210,216,.5);background:rgba(210,210,216,.1);padding:11px 20px;border-radius:6px\">META-COGNITIVE ROUTER<\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"width:100%;max-width:920px;border:1px dashed rgba(228,228,232,.35);border-radius:12px;padding:20px;background:rgba(228,228,232,.035)\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#eceae6;text-align:center;margin-bottom:16px\">DYNAMIC REASONING PORTFOLIO — SELECTED PER MISSION, NOT PER PRODUCT<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">retrieval<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">knowledge graph<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">statistical / predictive<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">causal<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">planner<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">code specialist<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d7d7da;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 13px;border-radius:5px\">simulation<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d8b0b0;border:1px solid rgba(207,154,154,.35);background:rgba(207,154,154,.07);padding:8px 13px;border-radius:5px\">adversarial critic<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9aab97;border:1px solid rgba(169,201,184,.35);background:rgba(169,201,184,.09);padding:8px 13px;border-radius:5px\">verifier<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#c2b49f;border:1px solid rgba(217,196,143,.4);background:rgba(217,196,143,.1);padding:11px 20px;border-radius:6px\">DISAGREEMENT + UNCERTAINTY<\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);padding:8px 13px;border-radius:5px\">gather more evidence<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);padding:8px 13px;border-radius:5px\">verify harder<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);padding:8px 13px;border-radius:5px\">simulate first<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;color:#c2b49f;border:1px solid rgba(217,196,143,.4);background:rgba(217,196,143,.09);padding:8px 13px;border-radius:5px\">abstain — an allowed optimal policy<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:6px\">ACTION POLICY<\u002Fspan>\n            <span style=\"color:#9c9ca5\">→<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#9aab97;border:1px solid rgba(169,201,184,.4);background:rgba(169,201,184,.1);padding:9px 16px;border-radius:6px\">AUTHORITY GATE<\u002Fspan>\n            <span style=\"color:#9c9ca5\">→<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:6px\">ACTION<\u002Fspan>\n            <span style=\"color:#9c9ca5\">→<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#d5d3cd;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:6px\">OUTCOME<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:22px;background:rgba(255,255,255,.18)\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#0e0e10;background:linear-gradient(96deg,#c9c7c1,#eceae6);padding:10px 22px;border-radius:6px;font-weight:600\">MEMORY + TRUST + CONFIGURATION UPDATES<\u002Fdiv>\n          <div style=\"margin-top:14px;font-size:13.5px;line-height:1.6;color:#97979d;text-align:center;max-width:70ch\">The loop closes on itself: the outcome rewrites the routing, the trust weights and the configuration — so the next mission is answered by a slightly different mind.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n        <div style=\"border:1px solid rgba(210,210,216,.3);background:rgba(210,210,216,.05);border-radius:14px;padding:26px 28px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#cbcbd0;margin-bottom:8px\">RECURSIVE SIHRE<\u002Fdiv>\n          <h3 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:0 0 12px;color:#f4f4f5\">The same control pattern, five levels up.<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#bfc4cd;margin:0 0 20px\">Routing, trust, uncertainty, verification, escalation and abstention are the invariants. Only the semantics change as you climb — and at the top, the thing being routed is the organization itself.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:rgba(236,236,240,.09);border:1px solid rgba(236,236,240,.3)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#eeeef2\">FACTORY<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#e5e5e9\">routes among organization architectures — and can instantiate or mutate them<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(210,210,216,.25)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#cacad0\">ARMY<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#d5d3cd\">routes among teams — migration, research, monitoring, incident, refactor<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:rgba(200,200,208,.08);border:1px solid rgba(200,200,208,.25)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#cbcbd0\">TEAM<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#d5d3cd\">routes among agents — implementer, reviewer, tester, security, reliability<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:rgba(228,228,232,.07);border:1px solid rgba(228,228,232,.25)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#eceae6\">AGENT<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#d5d3cd\">routes among reasoning modalities — the loop above<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#97979d\">EXPERT<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#bfc4cd\">the cognitive primitive being trusted, promoted or suppressed<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:14px;line-height:1.6;color:#cacad0\">Morphological cognition is the consequence: the reasoning graph is runtime state, not architecture. The object being optimised stops being the prompt and becomes the topology.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(217,196,143,.3);background:rgba(217,196,143,.07);border-radius:14px;padding:26px 28px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#c2b49f;margin-bottom:8px\">WHAT IS AND IS NOT CLAIMED<\u002Fdiv>\n          <h3 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:0 0 12px;color:#f4f4f5\">The framework states its own boundaries.<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#b3a68c;margin:0 0 18px\">None of the individual mechanisms is claimed as new — mixture-of-experts, routing, conformal prediction, causal inference, RAG, debate, digital twins, transactive memory and organizational cybernetics all have substantial prior art. Saying so is the point.<\u002Fp>\n          <div style=\"font-size:14.5px;line-height:1.65;color:#e0ddd0;padding:16px 18px;border-left:2px solid rgba(217,196,143,.6);background:rgba(0,0,0,.2);border-radius:0 8px 8px 0;margin-bottom:18px\">The candidate contribution is narrower and harder: one persistent entity whose <strong style=\"color:#fff\">cognitive topology, expert trust, evidence acquisition, verification effort, risk posture, authority, memory and configuration are governed together as adaptive state<\u002Fstrong> — with the same principles recursively composable from expert to organization.<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;line-height:1.7;color:#a09a86;margin-bottom:10px\">AND THE EVIDENCE IT WOULD TAKE<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:#bfc4cd\">Temporal holdout evaluation, ablation of every subsystem, calibration curves, failure-correlation analysis, and proof that dynamic routing beats fixed routing. Until then it is a research architecture, stated as one — which is why there is no chip on this page reading VALIDATED next to it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;line-height:1.7;color:#97979d\">SIHRE FRAMEWORK — PAUL RUSSELL · TRANSLATED INTO <span style=\"font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.03em;white-space:nowrap;margin:0 .14em\"><span style=\"background:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\">CELL<\u002Fspan><span data-wm-slash=\"1\" style=\"color:#bcd8ff;padding:0 .2em;animation:cellosglow 2.9s ease-in-out infinite\">//<\u002Fspan><span style=\"background:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);-webkit-background-clip:text;background-clip:text;color:transparent\">OS<\u002Fspan><\u002Fspan> AS THE OPERATIVE'S COGNITIVE KERNEL · RECURSIVE APPLICATION IS RESEARCH, NOT SHIPPED<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sihre-detail\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d\">FEATURED RESEARCH — SIHRE<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#cba3b8;border:1px solid rgba(203,163,184,.36);background:rgba(203,163,184,.07);padding:4px 9px;border-radius:4px\">RESEARCH SUMMARY · WHITEPAPER NOT YET PUBLISHED<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:start;margin-bottom:32px\">\n        <div>\n          <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;line-height:1.03;letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance\">Self-Improving Heterogeneous Reasoning Ensemble<\u002Fh2>\n          <p style=\"font-size:16.5px;line-height:1.65;color:#bfc4cd;margin:0 0 16px;text-wrap:pretty\"><strong style=\"color:#eceae6;font-weight:600\">The problem.<\u002Fstrong> A more elaborate reasoning system can produce better-looking explanations while making evaluation harder — introducing correlated mistakes, or quietly shifting the work onto whoever reviews the output.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.65;color:#bfc4cd;margin:0 0 16px;text-wrap:pretty\"><strong style=\"color:#eceae6;font-weight:600\">The proposed approach.<\u002Fstrong> Coordinate several reasoning approaches instead of one, ground every objection in a source, keep reliability judgements specific to context, and adapt only within reviewed bounds. Then treat the whole thing as a hypothesis: make research evidence independently checkable first, and investigate whether selective SIHRE assistance improves that work.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.65;color:#97979d;margin:0;text-wrap:pretty\">The strongest supported direction in the supplied evaluation is exactly that order — checkable evidence first, then a bounded question about whether the ensemble helps. There is no evidence of an optimal pipeline or a measured performance gain.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%)\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;color:#97979d\">WHAT IS ACTUALLY ESTABLISHED<\u002Fdiv>\n          <sc-for list=\"{{ sihreFacts }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:5px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.06)\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d\">{{ r.k }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;white-space:nowrap;color:{{ r.fg }}\">{{ r.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.55;color:#d5d3cd;text-wrap:pretty\">{{ r.v }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;margin-bottom:16px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%)\">\n        <div style=\"padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(163,182,207,.06),rgba(255,255,255,.008))\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;color:#a2a2aa;margin-bottom:6px\">PROPOSED ARCHITECTURE — FOUR SEPARATED RESPONSIBILITIES<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.6;color:#97979d;text-wrap:pretty\">Grounded in the optimization addendum’s first priority. These are logical boundaries: they do not require four services, multiple repositories, a mesh or a distributed system. Every component and connection is proposed — no runtime was inspected.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:rgba(255,255,255,.07)\">\n          <sc-for list=\"{{ sihreArch }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:linear-gradient(160deg,#1a1b21,#151317);padding:18px 20px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:{{ c.fg }};margin-bottom:10px\">{{ c.n }}<\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.6;color:#d5d3cd;text-wrap:pretty\">{{ c.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;line-height:1.7;color:#97979d\">EVIDENCE → REASONING → ASSESSMENT → APPROVAL · THE FEEDBACK USED TO REVISE AN ANSWER MUST NOT BE THE EVIDENCE USED TO JUDGE WHETHER THE REVISION HELPED<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px;margin-bottom:16px\">\n        <sc-for list=\"{{ sihreTiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:17px 19px;background:linear-gradient(155deg,rgba(163,182,207,.06),rgba(169,201,184,.04))\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:{{ t.fg }};margin-bottom:12px\">{{ t.k }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ t.items }}\" as=\"x\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:12.5px;line-height:1.6;color:#d5d3cd;text-wrap:pretty\">{{ x }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px\">\n        <div style=\"border:1px solid rgba(169,201,184,.3);background:rgba(169,201,184,.07);border-radius:12px;padding:17px 19px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#9aab97;margin-bottom:10px\">RELATIONSHIP TO <span style=\"font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.03em;white-space:nowrap;margin:0 .14em\"><span style=\"background:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\">CELL<\u002Fspan><span data-wm-slash=\"1\" style=\"color:#bcd8ff;padding:0 .2em;animation:cellosglow 2.9s ease-in-out infinite\">//<\u002Fspan><span style=\"background:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);-webkit-background-clip:text;background-clip:text;color:transparent\">OS<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.6;color:#d9e1dc;text-wrap:pretty\">The roadmap holds SIHRE as a cross-cutting research and evaluation capability under evaluation and learning, with frontier variants under experimental organization generation. It is not automatically a separate commercial product, and it is outside first-release scope. Potential reuse of existing platform components is recorded as unknown until a current contract or behaviour is inspected.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(203,163,184,.3);background:rgba(203,163,184,.07);border-radius:12px;padding:17px 19px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#cba3b8;margin-bottom:10px\">WHY THERE IS NO DOWNLOAD<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.6;color:#e2d4db;text-wrap:pretty\">The underlying whitepaper is reported as a draft under review. Its public-after-review label is explicitly not permission to republish it, and the draft was not supplied here. This page is a clearly labelled research preview written from the evaluation dossier; no paper is offered for download until a version approved for public sharing exists.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"loop\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d;margin-bottom:18px\">THE CONTINUOUS LEARNING LOOP<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;line-height:1.04;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance\">Every organization it compiles is a hypothesis. The loop is how it gets scored.<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#bfc4cd;max-width:76ch;margin:0 0 34px;text-wrap:pretty\">Six stations, and the fifth one is the only place configuration is allowed to change. What comes out of the sixth is not a better prompt — it is a different organization, with a version number and a verdict pinned to it.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px\">\n        <span role=\"group\" aria-label=\"Walk the loop\" style=\"display:flex;gap:6px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ loopPrev }}\" aria-label=\"Previous station\" style=\"white-space:nowrap;cursor:pointer;border:1px solid #454a55;border-radius:8px;min-height:42px;padding:0 15px;background:#1b1c21;color:#cdd5e2;font-size:14px;font-weight:600\" style-hover=\"border-color:rgba(188,216,255,.5);color:#eceae6\">‹ Prev<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ loopToggle }}\" aria-pressed=\"{{ loopPlaying }}\" aria-label=\"{{ loopPlayAria }}\" style=\"white-space:nowrap;cursor:pointer;border:1px solid {{ loopPlayBd }};border-radius:8px;min-height:42px;padding:0 18px;background:{{ loopPlayBg }};color:#eceae6;font-family:'Archivo',sans-serif;font-size:14.5px;font-weight:700;min-width:104px\" style-hover=\"border-color:rgba(188,216,255,.7)\">{{ loopPlayLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ loopNext }}\" aria-label=\"Next station\" style=\"white-space:nowrap;cursor:pointer;border:1px solid #454a55;border-radius:8px;min-height:42px;padding:0 15px;background:#1b1c21;color:#cdd5e2;font-size:14px;font-weight:600\" style-hover=\"border-color:rgba(188,216,255,.5);color:#eceae6\">Next ›<\u002Fbutton>\n        <\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#8d94a1\">{{ loopPosition }}<\u002Fspan>\n        <span style=\"display:{{ loopRunShow }};align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#bcd8ff;white-space:nowrap\"><span style=\"width:6px;height:6px;border-radius:50%;background:#bcd8ff;animation:cellospulse 1.6s ease-in-out infinite\"><\u002Fspan>ADVANCING EVERY {{ loopSpeedLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n        <sc-for list=\"{{ stations }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"display:contents\">\n          <button type=\"button\" sc-camel-on-click=\"{{ s.select }}\" sc-camel-on-mouse-enter=\"{{ s.hover }}\" sc-camel-on-mouse-leave=\"{{ s.unhover }}\" sc-camel-on-focus=\"{{ s.hover }}\" sc-camel-on-blur=\"{{ s.unhover }}\" style=\"cursor:pointer;text-align:left;padding:0 0 20px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px;min-height:150px\" style-hover=\"border-color:rgba(228,228,232,.3)\">\n            <span style=\"background:{{ s.bar }};height:3px;flex:0 0 3px;background-size:220% 100%;animation:cellosbarflow 2.6s linear infinite\"><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:8px;flex:1;padding:14px 16px 0\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.1em;color:{{ s.nfg }}\">{{ s.n }}<\u002Fspan>\n            <span style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:16px;letter-spacing:.01em;overflow-wrap:anywhere;color:{{ s.kfg }}\">{{ s.key }}<\u002Fspan>\n            <span style=\"font-size:12.5px;line-height:1.45;color:#97979d;flex:1\">{{ s.line }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:{{ s.chipfg }};border:1px solid {{ s.chipbd }};background:{{ s.chipbg }};padding:3px 6px;border-radius:3px;align-self:flex-start;white-space:nowrap\">{{ s.mat }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;margin:10px 0 0;padding:12px 18px;border:1px dashed rgba(228,228,232,.3);border-radius:8px;background:rgba(228,228,232,.03)\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#eceae6\">↺<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#eceae6\">THE LOOP CLOSES HERE — 06 FEEDS 01 WITH A NEW CONFIGURATION, NOT A NEW INSTRUCTION<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start\">\n        <div style=\"background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),#131316;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:28px 30px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:{{ activeStation.fg }}\">{{ activeStation.n }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d\">{{ activeStation.mat }}<\u002Fspan>\n            <span style=\"display:{{ hoverShow }};margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#bcd8ff;border:1px solid rgba(188,216,255,.45);border-radius:4px;padding:3px 7px;white-space:nowrap\">HOVER PREVIEW<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:0 0 14px;color:#f4f4f5\">{{ activeStation.key }}<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:3px;margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9db2cc\">FUNCTION<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.55;color:#eceae6\">{{ activeStation.fn }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:15.5px;line-height:1.68;color:#bfc4cd;margin:0 0 16px;text-wrap:pretty\">{{ activeStation.detail }}<\u002Fp>\n          <div style=\"display:{{ handoffShow }};flex-direction:column;gap:5px;margin:0 0 18px;padding:15px 17px;border:1px solid rgba(157,178,204,.28);border-radius:10px;background:rgba(157,178,204,.05)\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9db2cc\">PASSES ON TO {{ activeStation.nextLabel }}<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.6;color:#dfe4ea\">{{ activeStation.passes }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.55;color:#97979d;border-top:1px solid rgba(255,255,255,.08);padding-top:14px\">{{ activeStation.ev }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"border:1px solid rgba(169,201,184,.28);background:rgba(169,201,184,.07);border-radius:12px;padding:22px 24px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#9aab97;margin-bottom:10px\">TWO KINDS OF MEMORY<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.6;color:#d9e1dc;margin-bottom:12px\"><strong style=\"color:#fff\">Failure memory<\u002Fstrong> stores the precursor, the diagnosis, the fix and the outcome — so the same fault cannot arrive twice unannounced.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.6;color:#b3a68c\"><strong style=\"color:#e6e2d6\">Near-miss memory<\u002Fstrong> is the one that is genuinely missing: a run that <em>succeeded<\u002Fem> while carrying a lesson currently leaves no trace at all.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(207,154,154,.28);background:rgba(207,154,154,.05);border-radius:12px;padding:22px 24px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#d8b0b0;margin-bottom:10px\">WHY THE LOOP IS DELIBERATELY THROTTLED<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.6;color:#dedada\">There is no optimizer on the end of this yet, and that is a decision rather than a gap. A loop that searches configurations against an instrument which cannot tell two of them apart is the mechanism this whole estate was founded on refusing: it ran <strong style=\"color:#fff\">many times, recorded its own low success rate, and never adjusted.<\u002Fstrong> It was capable. It was not measurable.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"doctrine\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d;margin-bottom:18px\">SIGNATURE FRAMEWORKS<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;line-height:1.04;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance\">The frameworks that came out of building it.<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#bfc4cd;max-width:74ch;margin:0 0 20px;text-wrap:pretty\">None of these were designed in the abstract. Each one was authored by <strong style=\"color:#d7d7da;font-weight:600\">Paul Russell<\u002Fstrong> in response to a specific failure, and each one is codified in a file with a check that can fail — which is the difference between a framework and an opinion. Enforcement at runtime is not verified here.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#97979d;max-width:74ch;margin:0 0 36px;text-wrap:pretty\">They are <strong style=\"color:#d7d7da;font-weight:600\">not part of the multi-layer architecture<\u002Fstrong>. They sit outside it, and above it: portable rules that hold whether or not you ever run a single Cell. The architecture is one implementation of them.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px\">\n        <div style=\"border:1px solid rgba(169,201,184,.28);background:rgba(169,201,184,.07);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#9aab97\">01 — THE VERDICT LATTICE<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">contract.py<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">A check whose instrument could not run has not passed.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Five verdicts that never collapse, with ERROR outranking FAIL. Adapted from conformance testing into agent work — where nobody was doing it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#eceae6\">02 — THE MATURITY CHIP<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">every surface<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">Put the status in the frame that makes the claim.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Nobody reads a disclaimer at the end. Designed, implemented or validated, stated where the claim is made — including on this page, which is why you can trust the rest of it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#eceae6\">03 — EVIDENCE-GATED COMPLETION<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">tasks.py<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">A claim of completion is not an outcome.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Prove the target, validate at the consumer’s layer, prove no regression, capture a rollback — or the work does not land at all.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#eceae6\">04 — THE ISOLATION LADDER<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">T0 · T1 · T2<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">Isolate by what the work touches, not by what the agent is.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Sandboxing a filesystem does nothing when the risk is a destructive statement on a shared warehouse. The tier is declared up front and is designed to be enforced below.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.1);background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#cbcbd0\">05 — THE BRIEF COMPILER<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">pack-wins rule<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">Ship the evidence with the question — and refuse the brief without it.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Where the pack and the prompt disagree, the pack wins, and the disagreement is a finding. NOT-SUPPLIED beats a plausible assumption. Three same-day failures, all of them brief quality, none of them capability.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(217,196,143,.28);background:rgba(217,196,143,.07);border-radius:12px;padding:24px 26px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#c2b49f\">06 — THE NEGATIVE CONTROL<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#97979d\">connector_contract.py<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:500;font-size:20px;line-height:1.3;color:#f4f4f5;margin-bottom:10px\">An eval that cannot fail is not an eval.<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#bfc4cd\">Every assertion must be shown able to register a failure before its pass means anything. The founding story of this estate is a loop that ran many times, recorded its own low success rate, and never adjusted (source and date of the figures unknown; not published here). It was capable. It was not measurable.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;line-height:1.7;color:#97979d\">\n        <span>ALSO IN THE DOCTRINE —<\u002Fspan>\n        <span style=\"color:#bfc4cd\">ZERO IS NOT NOT-RECORDED<\u002Fspan><span>·<\u002Fspan>\n        <span style=\"color:#bfc4cd\">A REJECTED OPTION IS EVIDENCE, NOT CLUTTER<\u002Fspan><span>·<\u002Fspan>\n        <span style=\"color:#bfc4cd\">ONE CURRENT HEAD PER WORKSTREAM<\u002Fspan><span>·<\u002Fspan>\n        <span style=\"color:#bfc4cd\">A QUERY CHECK IS NOT A RENDER CHECK<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"register\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d;margin-bottom:18px\">THE RESEARCH REGISTER<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;line-height:1.04;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance\">Every open question, written down before anyone was asked to answer it.<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#bfc4cd;max-width:78ch;margin:0 0 30px;text-wrap:pretty\">A product that refuses to overstate what it has built needs somewhere to put what it does not yet know. This is that place — dispatched research questions, contradictions held open on purpose, findings that changed the build, and gaps with the condition that unlocks each one. Click a group to open it.<\u002Fp>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#eceae6;flex:0 0 auto;white-space:nowrap;border:1px solid rgba(242,242,244,.4);padding:4px 9px;border-radius:4px\">OPEN<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#c2b49f;flex:0 0 auto;white-space:nowrap;border:1px solid rgba(217,196,143,.4);padding:4px 9px;border-radius:4px\">CONTESTED<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#9aab97;flex:0 0 auto;white-space:nowrap;border:1px solid rgba(169,201,184,.4);padding:4px 9px;border-radius:4px\">SETTLED<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#cf9a9a;flex:0 0 auto;white-space:nowrap;border:1px solid rgba(207,154,154,.45);padding:4px 9px;border-radius:4px\">BLOCKED — WITH A STATED UNLOCK<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ research }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"display:contents\">\n          <div style=\"border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.015)\" style-hover=\"border-color:rgba(228,228,232,.26)\">\n              <span style=\"background:{{ g.bar }};height:2px;display:block\"><\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ g.toggle }}\" style=\"cursor:pointer;width:100%;text-align:left;background:none;border:0;display:grid;grid-template-columns:38px 1fr auto 26px;gap:18px;align-items:center;padding:18px 20px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:{{ g.nfg }}\">{{ g.n }}<\u002Fspan>\n              <span>\n                <span style=\"display:block;font-family:'Archivo',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.005em;color:{{ g.kfg }}\">{{ g.name }}<\u002Fspan>\n                <span style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:#97979d;margin-top:4px\">{{ g.count }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d;white-space:nowrap\">{{ g.out }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#97979d;text-align:center\">{{ g.chev }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-for list=\"{{ g.comps }}\" as=\"c\" hint-placeholder-count=\"0\">\n              <div style=\"display:grid;grid-template-columns:260px 1fr 110px;gap:20px;padding:14px 20px 14px 56px;border-top:1px solid rgba(255,255,255,.06);animation:cellosrise .26s ease both;align-items:start\">\n                <span style=\"font-size:14.5px;line-height:1.45;color:#eceae6\">{{ c.name }}<\u002Fspan>\n                <span style=\"font-size:13.5px;line-height:1.5;color:#bfc4cd\">{{ c.note }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:{{ c.tfg }};border:1px solid {{ c.tbd }};padding:4px 7px;border-radius:4px;text-align:center;white-space:nowrap\">{{ c.tag }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:20px 24px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),rgba(255,255,255,.02);font-size:14.5px;line-height:1.65;color:#bfc4cd\">A register like this is usually kept private, because it reads as a list of weaknesses. It is the opposite: every line here is a question someone bothered to write down before it could be answered by accident.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"papers\" style=\"padding:96px 0 0;scroll-margin-top:20px\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d\">RESEARCH — PAPERS, INVESTIGATIONS AND FINDINGS<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9db2cc;border:1px solid rgba(163,182,207,.38);background:rgba(163,182,207,.08);padding:4px 9px;border-radius:4px\">RESEARCH MATURITY ≠ IMPLEMENTATION PROGRESS<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:start;margin-bottom:34px\">\n        <div>\n          <h2 style=\"font-family:'Archivo',sans-serif;fon
