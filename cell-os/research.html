t-weight:600;font-size:44px;line-height:1.05;letter-spacing:-.025em;margin:0 0 18px;text-wrap:balance\">The research is written to be argued with.<\u002Fh2>\n          <p style=\"font-size:16.5px;line-height:1.65;color:#bfc4cd;margin:0 0 16px;text-wrap:pretty\">Each entry states its question, its approach, what its evidence establishes and what it explicitly cannot. Editorial status is shown as it stands in the source — candidate, addendum, superseded, or not supplied.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.65;color:#97979d;margin:0;text-wrap:pretty\">A described framework is not an implemented platform capability. Where a study has no result, the entry says so instead of paraphrasing an intention as a finding.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:18px 20px;background:linear-gradient(155deg,rgba(163,182,207,.06),rgba(169,201,184,.04))\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d;margin-bottom:12px\">HOW TO READ AN ENTRY<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#9db2cc\">CANDIDATE<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#d5d3cd\">A decision input. It approves no architecture, requirement or release.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#9aab97\">ADDENDUM<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#d5d3cd\">An editorial and conceptual review of an existing artifact.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#97979d\">SUPERSEDED<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#d5d3cd\">Preserved for comparison. Not current authority.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#cba3b8\">NOT SUPPLIED<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#d5d3cd\">Named, but its source has never been supplied to this artifact.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px\">\n        <sc-for list=\"{{ rsTopics }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div style=\"display:contents\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.go }}\" style=\"cursor:pointer;border:1px solid rgba(255,255,255,.14);background:none;padding:0;border-radius:6px;overflow:hidden;display:flex;flex-direction:column\" style-hover=\"border-color:rgba(220,220,224,.5)\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;padding:8px 12px;color:{{ t.fg }}\">{{ t.label }}<\u002Fspan>\n            <span style=\"background:{{ t.bar }};height:2px;display:block\"><\u002Fspan>\n          <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#97979d;margin-left:auto\">{{ rsCount }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px\">\n        <sc-for list=\"{{ rsItems }}\" as=\"i\" hint-placeholder-count=\"7\">\n          <div style=\"display:contents\">\n          <button type=\"button\" sc-camel-on-click=\"{{ i.open }}\" style=\"cursor:pointer;text-align:left;border:1px solid rgba(255,255,255,.09);background:linear-gradient(155deg,rgba(163,182,207,.06),rgba(169,201,184,.04));border-radius:11px;padding:0;overflow:hidden;display:flex;flex-direction:column;gap:0\" style-hover=\"border-color:rgba(163,182,207,.4)\">\n              <span style=\"background:{{ i.bar }};height:2px;flex:0 0 2px;align-self:stretch\"><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:9px;padding:16px 17px;transition:all .22s\">\n            <span style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;line-height:1.7;color:#97979d\">{{ i.kicker }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;white-space:nowrap;color:{{ i.sfg }};border:1px solid {{ i.sbd }};background:{{ i.sbg }};padding:3px 6px;border-radius:4px\">{{ i.slabel }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:500;line-height:1.32;color:#eceae6;text-wrap:pretty\">{{ i.title }}<\u002Fspan>\n            <span style=\"font-size:12.5px;line-height:1.55;color:#97979d;text-wrap:pretty\">{{ i.q }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#9db2cc\">OPEN DETAIL ›<\u002Fspan>\n              <\u002Fspan>\n          <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ rsSelOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;border:1px solid rgba(163,182,207,.3);border-radius:14px;padding:24px 26px;background:linear-gradient(160deg,rgba(163,182,207,.08),rgba(169,201,184,.04));animation:cellosrise .3s ease-out both\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px\">\n            <div style=\"display:flex;align-items:baseline;gap:11px;flex-wrap:wrap\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d\">{{ rsDetail.kicker }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:{{ rsDetail.sfg }};border:1px solid {{ rsDetail.sbd }};background:{{ rsDetail.sbg }};padding:3px 7px;border-radius:4px\">{{ rsDetail.slabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ rsDetail.close }}\" style=\"cursor:pointer;background:none;border:1px solid rgba(255,255,255,.14);color:#97979d;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;padding:6px 11px;border-radius:5px\">CLOSE<\u002Fbutton>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:26px;line-height:1.18;letter-spacing:-.02em;color:#eceae6;margin:0 0 16px;text-wrap:balance\">{{ rsDetail.title }}<\u002Fh3>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:20px\">\n            <div style=\"border:1px solid rgba(163,182,207,.28);background:rgba(163,182,207,.06);border-radius:10px;padding:14px 16px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#9db2cc;margin-bottom:8px\">RESEARCH QUESTION<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#dfe4ea;text-wrap:pretty\">{{ rsDetail.q }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:14px 16px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%)\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d;margin-bottom:8px\">APPROACH<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#d5d3cd;text-wrap:pretty\">{{ rsDetail.approach }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#9aab97;margin-bottom:11px\">WHAT THE EVIDENCE SUPPORTS<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ rsDetail.findings }}\" as=\"x\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:13px minmax(0,1fr);gap:9px;align-items:baseline\">\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9aab97\">·<\u002Fspan>\n                    <span style=\"font-size:13px;line-height:1.6;color:#d9e1dc;text-wrap:pretty\">{{ x.t }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#cba3b8;margin-bottom:11px\">LIMITATIONS AND OPEN QUESTIONS<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ rsDetail.limits }}\" as=\"x\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:13px minmax(0,1fr);gap:9px;align-items:baseline\">\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#cba3b8\">·<\u002Fspan>\n                    <span style=\"font-size:13px;line-height:1.6;color:#e2d4db;text-wrap:pretty\">{{ x.t }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start;margin-top:20px;border-top:1px solid rgba(255,255,255,.08);padding-top:18px\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d;margin-bottom:10px\">REFERENCES<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <sc-for list=\"{{ rsDetail.refs }}\" as=\"x\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:12.5px;line-height:1.5;color:#bfc4cd;text-wrap:pretty\">{{ x.t }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#97979d;margin-bottom:10px\">RELATED ROADMAP WORK<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:12px\">\n                <sc-for list=\"{{ rsDetail.rel }}\" as=\"x\" hint-placeholder-count=\"2\">\n                  <span style=\"font-size:12.5px;line-height:1.5;color:#d5d3cd;text-wrap:pretty\">{{ x.t }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ rsDetail.toRoadmap }}\" style=\"cursor:pointer;background:none;border:1px solid rgba(163,182,207,.4);color:#cdd5e2;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;padding:9px 13px;border-radius:6px\">OPEN THE ROADMAP ›<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rsHint }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:14px;border:1px dashed rgba(255,255,255,.12);border-radius:12px;padding:18px 20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;line-height:1.8;color:#97979d\">SELECT AN ENTRY FOR ITS QUESTION, APPROACH, SUPPORTED FINDINGS, LIMITATIONS, REFERENCES AND RELATED ROADMAP WORK.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section style=\"padding:96px 0 0\">\n      <div style=\"border:1px solid #454a55;border-radius:16px;background:radial-gradient(118% 88% at 72% 4%,rgba(30,155,255,.17),rgba(123,92,255,.12) 40%,rgba(224,57,159,.08) 66%,rgba(0,0,0,0) 86%),linear-gradient(152deg,#2b2d34,#232529 58%,#1d1f23);padding:40px 38px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px;align-items:center\">\n        <div>\n          <h2 style=\"font-family:'Archivo',sans-serif;font-weight:600;font-size:32px;line-height:1.08;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance\">The research supports a platform that is still being built.<\u002Fh2>\n          <p style=\"font-size:15.5px;line-height:1.6;color:#bfc4cd;margin:0;max-width:52ch\">SIHRE belongs to the platform rather than to any one product, so every product in the family carries it by construction. The architecture record shows where it sits.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <a href=\"architecture.html\" style=\"display:inline-flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(188,216,255,.5);border-radius:10px;padding:15px 20px;background:linear-gradient(150deg,#2a3348,#1d2130 62%,#181a22);color:#f4f9ff;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;text-decoration:none\">The architecture record<span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#bcd8ff\">↗<\u002Fspan><\u002Fa>\n          <a href=\"index.html#top\" style=\"display:inline-flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #454a55;border-radius:10px;padding:15px 20px;color:#cdd5e2;font-weight:600;font-size:15px;text-decoration:none\">Back to the site<span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9db2cc\">↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n    <footer style=\"margin-top:96px;padding:36px 0 40px;border-top:1px solid #232327;display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px 32px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:46ch\">\n        <span style=\"font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.03em;white-space:nowrap;line-height:1;font-size:22px\"><span style=\"background:linear-gradient(168deg,#f3f6fa 4%,#c3c9d4 26%,#8d94a1 48%,#6e757f 58%,#b9c0cb 78%,#e6eaf1 96%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))\">CELL<\u002Fspan><span data-wm-slash=\"1\" style=\"color:#bcd8ff;padding:0 .2em;animation:cellosglow 2.9s ease-in-out infinite\">//<\u002Fspan><span style=\"background:linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f);-webkit-background-clip:text;background-clip:text;color:transparent\">OS<\u002Fspan><\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:#a2a7b0\">This site presents the intended full product. Capabilities are labelled Implemented, Demonstrated, Designed or Research; current availability is summarized on the Status page. Interactive examples run on fictional data in your browser.<\u002Fp>\n      <\u002Fdiv>\n      <nav aria-label=\"Footer\" style=\"display:flex;flex-wrap:wrap;gap:4px 8px\">\n        <a href=\"about.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">About<\u002Fa><a href=\"research.html\" aria-current=\"page\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">Research<\u002Fa><a href=\"sihre.html\" aria-current=\"page\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">SIHRE<\u002Fa><a href=\"evidence.html\" aria-current=\"page\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">Evidence<\u002Fa><a href=\"architecture.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">Architecture<\u002Fa><a href=\"status.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">Status<\u002Fa><a href=\"onboarding.html\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:#cdd5e2;font-size:14.5px;font-weight:600;text-decoration:none\" style-hover=\"color:#eceae6;text-decoration:underline\">Client onboarding · fictional prototype<\u002Fa>\n      <\u002Fnav>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180},&quot;loopAutoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning loop&quot;,&quot;label&quot;:&quot;Play the loop on load&quot;},&quot;loopSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Learning loop&quot;,&quot;label&quot;:&quot;Seconds per station&quot;},&quot;loopHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning loop&quot;,&quot;label&quot;:&quot;Preview a station on hover&quot;},&quot;loopShowHandoff&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning loop&quot;,&quot;label&quot;:&quot;Show what each station passes on&quot;},&quot;technicalDetail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Page&quot;,&quot;label&quot;:&quot;Technical detail on by default&quot;}}\">\nconst MAT = {\n  DESIGNED:    { fg:'#a2a2aa', bd:'rgba(140,140,148,.5)', bg:'transparent' },\n  IMPLEMENTED: { fg:'#eceae6', bd:'rgba(242,242,244,.42)', bg:'rgba(242,242,244,.13)' },\n  VALIDATED:   { fg:'#9aab97', bd:'rgba(169,201,184,.36)', bg:'rgba(169,201,184,.10)' },\n  REFUSED:     { fg:'#d8b0b0', bd:'rgba(207,154,154,.38)', bg:'rgba(207,154,154,.08)' }\n};\n\nconst RESEARCH = [\n  { n:'R1', name:'Open research questions', out:'eight deep-research prompts, dispatched', comps:[\n    ['DR01 — Prior art and novelty','which of the ten differentiators survives contact with existing literature','OPEN'],\n    ['DR02 — Cognitive portfolio theory','can error covariance be a first-class selection variable for a team','OPEN'],\n    ['DR03 — Recursive SIHRE','does one trust formalism hold at expert, agent, team and organization levels','OPEN'],\n    ['DR04 — Contextual trust and the KG mesh','evidence-based trust conditioned on mission state, not a global score','OPEN'],\n    ['DR05 — Homeostasis, immunity and self-model','can cognitive operating state be controlled rather than merely observed','OPEN'],\n    ['DR06 — Evaluation and benchmarks','what benchmark would show dynamic routing beating fixed routing','OPEN'],\n    ['DR07 — Cross-domain transfer','human behaviour to computational countermeasure, with a design rule','OPEN'],\n    ['DR08 — Entity definition and naming','what a persistent cognitive entity actually is, before we name it','OPEN'] ] },\n  { n:'R2', name:'Contradictions held open on purpose', out:'not resolved by preference', comps:[\n    ['CN-01 — the mission compiler category','the idea that intent compiles to an organization is itself contested in the corpus','CONTESTED'],\n    ['CN-03 — context as virtual memory','the most contested concept on the register; designed, never built','CONTESTED'],\n    ['Agent KG mesh vs. structured assembly','two sources disagree on whether to retrieve from a corpus or assemble deliberately','CONTESTED'],\n    ['Multi-agent formation','averaged −3.5% across 180 configurations, yet worker-plus-reviewer found 6 real defects in one diff','CONTESTED'] ] },\n  { n:'R3', name:'Findings that changed the build', out:'one file per finding, in version control', comps:[\n    ['F76 — the eval can fail, but it cannot generalise','the negative control proves sensitivity; 48 connectors have never been scored','SETTLED'],\n    ['F71 — agent-to-agent dialogue','left unbuilt deliberately: every question that actually arose needed a human','SETTLED'],\n    ['The unadjusting loop','ran many times, recorded its own low success rate, never adjusted. Capable, not measurable','SETTLED'],\n    ['Cost is recorded only on success','a run that fails costs money and leaves no cost row — the cheapest runs to study are invisible','OPEN'],\n    ['A MEASURED claim that had gone stale','an architecture doc carried a false statement under the MEASURED tier; found by re-measuring, not re-reading','SETTLED'],\n    ['Near-miss memory','a successful run carrying a lesson currently leaves no trace at all','OPEN'] ] },\n  { n:'R4', name:'Gaps with a stated unlock condition', out:'refused until the condition is met', comps:[\n    ['Eval corpus: 1 case, 0 strata','detecting a blind spot present in 10% of cases needs about 29. Until then, no optimiser','BLOCKED'],\n    ['GAP-20 — SIHRE transfer validity','the pack states its own requirement: transfer from quantitative finance needs agent-specific evaluation','BLOCKED'],\n    ['A data-model contract','no definition of done exists for a data-model change, and a query check is not a render check','BLOCKED'],\n    ['Two REPORTED-unverified citations','the strongest numbers behind context assembly have not been read at source','BLOCKED'],\n    ['Shapley cognitive credit','on the register, no research pass has looked at it','OPEN'] ] },\n  { n:'R5', name:'Assumptions only the founder can settle', out:'they change what should be built', comps:[\n    ['Productised, or internal tooling?','the brief reads as a product; nothing else confirms commercial intent','OPEN'],\n    ['Does the buyer ever open the interface?','if a non-engineer sees proof, the approval plane becomes a product surface','OPEN'],\n    ['One estate or many?','if the end state is N client estates, multi-tenancy stops being a backlog item','OPEN'],\n    ['What is the timeline?','no date has been stated, so no design can currently be judged too slow','OPEN'] ] }\n];\nconst RTAG = { OPEN:{fg:'#eceae6',bd:'rgba(242,242,244,.4)'}, CONTESTED:{fg:'#c2b49f',bd:'rgba(217,196,143,.4)'}, SETTLED:{fg:'#9aab97',bd:'rgba(169,201,184,.4)'}, BLOCKED:{fg:'#cf9a9a',bd:'rgba(207,154,154,.45)'} };\n\n/* fn = what the station does; passes = what it hands to the next one. Authored, not measured. */\nconst LOOP = [\n  { n:'01', key:'RUN', mat:'VALIDATED', line:'A Cell executes inside its declared tier.',\n    detail:'Nothing enters the loop that was not bounded on the way in. The tier, the budget and the authority boundary are fixed before the first token — so an outcome can be attributed to a configuration rather than to a good day.', ev:'lanes.py · dispatch.py · budget on the spec',\n    fn:'Execute one bounded unit of work inside a declared tier.',\n    passes:'A completed execution with its tier, budget and authority boundary fixed before the first token — so the outcome can be attributed to a configuration.' },\n  { n:'02', key:'RECORD', mat:'VALIDATED', line:'Append-only. Runs, events, cost, evidence.',\n    detail:'The ledger is written whether the run went well or not, and it cannot be edited afterwards. This is the layer that lets this page tell you how many runs there were and how many passed, instead of quietly reporting the good ones.', ev:'⚠ cost is recorded on success — a failed run costs money and leaves no cost row',\n    fn:'Write what happened to an append-only ledger.',\n    passes:'Runs, events, cost rows and evidence pointers that cannot be edited afterwards — the raw material a verdict is allowed to read.' },\n  { n:'03', key:'VERDICT', mat:'VALIDATED', line:'The lattice scores it. UNMEASURABLE is a result, not a gap.',\n    detail:'A run that could not be measured produces a first-class outcome rather than a shrug. That is what makes the loop honest: the most common way a learning loop poisons itself is by treating an absent measurement as a passing one.', ev:'contract.py · five verdicts, never collapsed',\n    fn:'Score the recorded run against the lattice.',\n    passes:'One of five verdicts, with UNMEASURABLE carried as a first-class outcome rather than folded into a pass.' },\n  { n:'04', key:'FINDING', mat:'IMPLEMENTED', line:'A durable correction, one file per finding, in version control.',\n    detail:'Lessons are objects, not anecdotes in a chat log. Failure memory stores the precursor, the diagnosis, the fix and the outcome — which is how a single incident becomes organizational immunity instead of a story someone tells twice.', ev:'findings.d/ · ⭐ near-miss memory absent — a success with a lesson leaves no trace',\n    fn:'Turn a verdict into a durable, reusable correction.',\n    passes:'One file per finding in version control, carrying the precursor, the diagnosis, the fix and the outcome.' },\n  { n:'05', key:'RECONFIGURE', mat:'DESIGNED', line:'Routing, trust weights, expert promotion, spec version.',\n    detail:'The configuration is the thing that changes — not the prompt on the day. Trust is contextual and time-varying, experts are promoted or suppressed on evidence, and any change bumps a version that the next verdict is pinned to.', ev:'version covers 6 of 15 identity dimensions',\n    fn:'Change the configuration — the only station allowed to.',\n    passes:'A new configuration version: routing, trust weights, expert promotion and spec version, stamped so the next verdict can be pinned to it.' },\n  { n:'06', key:'RE-MEASURE', mat:'DESIGNED', line:'Same instrument, same corpus. Did the change help?',\n    detail:'The step that separates a learning loop from a busy one. A configuration change is a hypothesis, and it is scored against an instrument that has been shown able to fail — otherwise the loop is just motion with a decimal point attached.', ev:'blocked: corpus is 1 case, 0 strata · needs ~29',\n    fn:'Score the changed configuration on the same instrument.',\n    passes:'A comparison against the previous version — which closes the loop by handing 01 a different organization, not a different instruction.' }\n];\n\nconst RSTOPICS = [\n  { k:'all',      label:'ALL ENTRIES' },\n  { k:'evidence', label:'EVIDENCE & CREDIBILITY' },\n  { k:'optim',    label:'OPTIMIZATION' },\n  { k:'sihre',    label:'SIHRE MECHANISMS' },\n  { k:'product',  label:'PRODUCT WALKTHROUGH' },\n  { k:'inventory',label:'PLANNING INVENTORY' }\n];\n\nconst RSSTATUS = {\n  candidate: { label:'RESEARCH CANDIDATE', fg:'#9db2cc', bd:'rgba(163,182,207,.38)', bg:'rgba(163,182,207,.08)' },\n  addendum:  { label:'EDITORIAL ADDENDUM', fg:'#9aab97', bd:'rgba(169,201,184,.36)', bg:'rgba(169,201,184,.09)' },\n  superseded:{ label:'SUPERSEDED — PRESERVED', fg:'#a2a2aa', bd:'rgba(255,255,255,.18)', bg:'rgba(255,255,255,.04)' },\n  notsupplied:{ label:'SOURCE NOT SUPPLIED', fg:'#cba3b8', bd:'rgba(203,163,184,.36)', bg:'rgba(203,163,184,.07)' }\n};\n\nconst RSITEMS = [\n  { id:'r1', topic:'evidence', status:'candidate', kicker:'REPORT 1 OF THE SIHRE EVALUATION DOSSIER',\n    title:'Historical evidence and evaluation credibility',\n    q:'What makes an assessment trustworthy enough for someone else to inspect and challenge?',\n    approach:'Reads published reproducibility and robustness literature against a document-research workspace, then separates the reviewer questions that a single “verified” badge would collapse.',\n    findings:[\n      'Provenance, repeatability, correctness and usefulness under change each need distinct evidence — a successful run answers only one of them.',\n      'More logging has diminishing value: a long event history can show activity without showing the decisive source or assumption.',\n      'Shared memory between an answering worker and its evaluator is a leakage path that can make prior exposure look like new capability.'\n    ],\n    limits:[\n      'Every cited result is evidence about the setting its authors studied. None of it measures SIHRE, QUANTA or any system in this project.',\n      'QUANTA is the deprecated name for the research product now called CELL-Q // OS. The quotation above is preserved as written at the time.',\n      'Whether a particular record system makes these distinctions understandable is an implementation and comprehension question the report does not settle.'\n    ],\n    refs:['National Academies, 2019 — Reproducibility and Replicability in Science, Summary','W3C, 2013 — PROV-DM, §§2 and 5','Kapoor and Narayanan, 2023 — Patterns 4(9)','Koh and colleagues, 2021 — WILDS, ICML','Guo and colleagues, 2017 — On Calibration of Modern Neural Networks','Ovadia and colleagues, 2019 — NeurIPS 32'],\n    rel:['H08.1 — success contracts and instrument qualification','H08.2 — evidence-based readiness and verdict discipline'] },\n  { id:'r2', topic:'optim', status:'candidate', kicker:'REPORT 2 OF THE SIHRE EVALUATION DOSSIER',\n    title:'Optimization of non-market research workflows',\n    q:'What would “better” mean here, and how could an improvement claim mislead?',\n    approach:'Separates three objects that get conflated — the quality of a research artifact, the organization of the workflow, and the reasoning configuration of an assistant — then asks what evidence each would need.',\n    findings:[\n      'There is no defensible universal optimum without a stated objective, scope and human tradeoff.',\n      'Selection can exploit weaknesses in its own evaluation: try many configurations, keep the most favourable, and the report hides the process that chose it.',\n      'Cost has a denominator. “Cheaper per answer” is not “cheaper per independently accepted artifact.”',\n      'Routing is a plausible mechanism with bounded published evidence; a fixed workflow remains a credible alternative.'\n    ],\n    limits:[\n      'No cost figures, savings forecasts or efficiency estimates are supplied — measured costs and user preferences do not exist yet.',\n      'The proposed assessment dimensions are not a formula. Some conflict, and no combined score is offered.'\n    ],\n    refs:['Cawley and Talbot, 2010 — JMLR 11, §§4–6','Ong and colleagues, 2025 revision — RouteLLM, arXiv v4'],\n    rel:['H08.3 — comparative measurement under declared conditions','H08.5 — CELL ADAPT and configuration search experiments'] },\n  { id:'r3', topic:'sihre', status:'candidate', kicker:'REPORT 3 OF THE SIHRE EVALUATION DOSSIER',\n    title:'Where SIHRE could add value, and how to establish it',\n    q:'Which proposed mechanisms are worth investigating, and what evidence would settle them?',\n    approach:'Ranks the mechanisms qualitatively against the inspected literature, maps candidate contributions stage by stage across a research lifecycle, and defines four bounded studies.',\n    findings:[\n      'Source-backed verification is the strongest research candidate, followed by scoped routing and genuinely complementary review.',\n      'A critic adds value when it produces inspectable evidence — a located passage showing a definition changed — not when it says an analysis may be flawed.',\n      'A group of named roles cannot be presumed to supply independent judgement; shared omissions persist across the group.',\n      'An automated judge is another fallible component: consistent automated rankings can be consistently wrong.'\n    ],\n    limits:[\n      'The ranking is a qualitative inference from literature and proposals. It is not a measured ranking of implemented SIHRE features.',\n      'The four studies are bounded research questions, not executable instructions. No outcomes, effect sizes or participant counts are invented.'\n    ],\n    refs:['Gou and colleagues, 2024 revision — CRITIC, arXiv v4','Huang and colleagues, 2024 revision — LLMs Cannot Self-Correct Reasoning Yet, arXiv v2','Choi, Zhu and Li, 2025 — Debate or Vote, arXiv v2','Zheng and colleagues, 2023 — MT-Bench, arXiv v4','Gao and colleagues, 2023 — ALCE, EMNLP'],\n    rel:['H08.4 — SIHRE evaluation hypotheses','H08.6 — shadow comparison and seeded-fault evaluation'] },\n  { id:'add', topic:'optim', status:'addendum', kicker:'PREPARED 7 SEPTEMBER 2026 · VERSION 1.0',\n    title:'SIHRE Research Architecture — Optimization Addendum',\n    q:'Is a focused optimization review useful, and what should it change?',\n    approach:'Ten priority recommendations over the dossier, each stated as a proposed change with its user benefit, the evidence that would show improvement, and its tradeoff.',\n    findings:[\n      'Priority 1 — separate responsibility for evidence, reasoning, assessment and approval. Logical boundaries only; no mesh or distributed system is implied.',\n      'Priority 2 — make evidence version and review scope inseparable from the report; a changing folder is not a reference.',\n      'Priority 4 — keep credible assessment outside the improvement mechanism.',\n      'Priority 5 — keep SIHRE optional and justify additional reasoning effort by task need.',\n      'Priority 10 — reuse established record capabilities before inventing equivalents.'\n    ],\n    limits:[\n      'Findings concern the document’s specificity. They are not findings that the corresponding software is absent or defective.',\n      'A metric dictionary is proposed, but baselines, targets and sampling rules are not set. It explicitly avoids a single weighted “intelligence score”.',\n      'Potential platform reuse is recorded as unknown until a current contract or behaviour is inspected.'\n    ],\n    refs:['Reviews SIHRE_Research_Evaluation_Deep_Research_Reports_v1, 6 September 2026'],\n    rel:['H08.1 — producer and evaluator separation','H08.7 — reviewed promotion and regression detection'] },\n  { id:'guide', topic:'product', status:'candidate', kicker:'VERSION 1.1 · 6 SEPTEMBER 2026 · EDUCATIONAL SCOPE · HISTORICAL TITLE, QUANTA DEPRECATED → CELL-Q // OS',\n    title:'QUANTA // OS with SIHRE — Proposed Product Guide',\n    q:'What would a user actually do in a research workspace, and where could SIHRE participate?',\n    approach:'A ten-step walkthrough over one worked question, with a minimal proposed navigation of Research, Evidence, Analysis, and Review & History.',\n    findings:[\n      'SIHRE means Self-Improving Heterogeneous Reasoning Ensemble — a proposed system selecting among reasoning approaches, consulting evidence and memory, and handling uncertainty.',\n      'A complete explanation must separate the workspace, the reasoning process and the software that performs an analysis: a polished report can conceal a missing engine.',\n      'SIHRE would not make a numerical result true by explaining it convincingly, and would gain no permission by being more confident.',\n      'The interface should distinguish an unavailable source from one inspected and found unhelpful.'\n    ],\n    limits:[\n      'Classification RESEARCH_CANDIDATE, governance CAPTURED_CANDIDATE. It approves no requirements, architecture, implementation or release change.',\n      'No placement in it demonstrates that SIHRE trains a model, conducts a valid backtest, performs optimization or controls an external service.',\n      'This project contains no account access and no trading-execution workflow.'\n    ],\n    refs:['Inspected SIHRE whitepaper and consolidation pack, as reported in the guide'],\n    rel:['H06 — domain capabilities and products','H02.2 — research intake and evidence-linked synthesis'] },\n  { id:'queue', topic:'inventory', status:'superseded', kicker:'ORIGIN 3 SEPTEMBER 2026 · DO NOT DISPATCH AS A BATCH',\n    title:'Legacy SIHRE research queue — twenty reports',\n    q:'What was the original SIHRE-centred research programme, and what survives it?',\n    approach:'Four waves — grounding and validation, advanced optimization, adaptive Operatives, recursive organization and invention — preserved verbatim for comparison against the newer lanes.',\n    findings:[\n      'This is a planning inventory of twenty proposed reports. It is not twenty publication commitments and not twenty completed studies.',\n      'Superseded by a later consolidated manifest that reorganizes the same topics into dependency-ordered lanes.',\n      'Two standalone follow-ups remain potentially useful: a deferred frontier study, and an optional offline signal-fusion case study.'\n    ],\n    limits:[\n      'The original execution order must not be used without a repository readiness audit.',\n      'Presence of a topic in this queue establishes neither completion nor approval.'\n    ],\n    refs:['Preserved queue file, superseded by the optimized prompt manifest v2'],\n    rel:['H08 — evaluation, learning and controlled adaptation','H11 — experimental organization generation'] },\n  { id:'trio', topic:'inventory', status:'notsupplied', kicker:'THREE NAMED WHITEPAPER PROPOSALS',\n    title:'When a Passing Check Establishes Too Little · From Intent to an Approved Plan · When a Semantic Model Should Refuse an Answer',\n    q:'These three proposals were requested as featured previews. Their source is not in the supplied material.',\n    approach:'No preview is written, because writing one would mean inventing the research question, approach and findings of a paper this artifact has never seen.',\n    findings:[\n      'The three titles appear in no attachment currently supplied to this project.',\n      'The titles themselves suggest evidence-gate scope, intent-to-plan compilation, and refusal behaviour in a semantic model — all of which map to existing roadmap language, but none of which establishes what the proposals argue.'\n    ],\n    limits:[\n      'Nothing is summarised, quoted or characterised until the report is supplied.',\n      'The twenty-proposal inventory these are drawn from is a planning list, not a publication commitment.'\n    ],\n    refs:['Awaiting the brand report or the individual proposal drafts'],\n    rel:['H08.2 — verdict discipline (suggested by the first title, unconfirmed)','H01.3 — approval identity and required validation (suggested by the second, unconfirmed)'] }\n];\n\nconst SIHREFACTS = [\n  { k:'EXPANDED NAME', v:'Self-Improving Heterogeneous Reasoning Ensemble', s:'supported' },\n  { k:'PROPOSED BY', v:'Paul Russell — credited in this project’s records as the framework’s author', s:'reported' },\n  { k:'PRIMARY SOURCE HERE', v:'SIHRE Research Evaluation — Three Evidence Reports, prepared for Paul Russell, 6 September 2026, version 1.0', s:'supported' },\n  { k:'UNDERLYING WHITEPAPER', v:'Reported as a public draft under review, updated 23 May 2026. The draft itself was not supplied, so its exact title, version and authorship line cannot be verified here.', s:'unknown' },\n  { k:'AUTHORITY LABEL', v:'RESEARCH_CANDIDATE / CAPTURED_CANDIDATE — decision inputs only', s:'supported' },\n  { k:'IMPLEMENTATION', v:'SIHRE-lite (trust and abstention) was implemented in Python for one pre-registered study in October 2026. The full meta-orchestrator is not implemented inside the platform.', s:'supported' },\n  { k:'MEASURED BENEFIT', v:'One domain, one study: reliability-based trust lifted net Sharpe from −0.02 to 0.30 versus equal weighting on a 1975–2026 holdout (95% CI of the gain [0.12, 0.58]). Abstention showed no benefit. Details on the SIHRE page.', s:'supported' },\n  { k:'PUBLIC RELEASE', v:'The draft’s public-after-review label is explicitly not permission to republish it. No download is offered.', s:'supported' }\n];\n\nconst SIHREARCH = [\n  { n:'EVIDENCE', d:'Maintains source references and versions. Distinguishes an unavailable source from one inspected and found unhelpful.', fg:'#9db2cc' },\n  { n:'REASONING', d:'Produces a draft and its claims. This is where the ensemble’s heterogeneity and routing would live.', fg:'#cbcbd0' },\n  { n:'ASSESSMENT', d:'Judges whether the claims are supported, using information the author did not choose.', fg:'#9aab97' },\n  { n:'APPROVAL', d:'A human decision bound to an exact report version. Never delegated to the reasoning function.', fg:'#c2b49f' }\n];\n\nconst SIHRETIERS = [\n  { k:'PROPOSED MECHANISM', fg:'#9db2cc', items:[\n    'Selection among different reasoning approaches by task need, rather than one mandatory pipeline.',\n    'Source-backed verification, where an objection must carry the disputed claim and its evidence.',\n    'Context-specific reliability instead of one global trust score.',\n    'Bounded adaptation — preserving a reviewed lesson with its scope and applicable definitions.'\n  ] },\n  { k:'IMPLEMENTATION EVIDENCE', fg:'#a2a2aa', items:[\n    'SIHRE-lite: trust and abstention implemented for one pre-registered equity-signal study (October 2026), with leakage and placebo controls.',\n    'The full meta-orchestrator, recursive levels and adaptive memory are not implemented.'\n  ] },\n  { k:'EXPERIMENTAL FINDINGS', fg:'#cba3b8', items:[\n    'One SIHRE experiment has a result: trust supported (+0.32 Sharpe vs equal weight, CI [0.12, 0.58]); abstention falsified; one control test mis-specified and disclosed. Other candidate studies are not yet run.',\n    'The experimental findings that do exist are published results about other systems — routing, critiquing, debate, judging and calibration — which support mechanisms and cautions to investigate, not transfer.'\n  ] }\n];\n\n/* ── About ─────────────────────────────────────────────────────────────── */\n\nclass Component extends DCLogic {\n  state = { station:'03', openR:{}, rsFilter:'all', rsSel:null, detail:null, hover:null, playing:false };\n\n  /* Autoplay is opt-in and never starts under prefers-reduced-motion. */\n  componentDidMount() {\n    if (this.state.detail === null) this.setState({ detail: this.props.technicalDetail !== false });\n    const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (this.props.loopAutoplay && !rm) this.play();\n  }\n  componentWillUnmount() { this.stop(); }\n\n  speedMs() { const n = Number(this.props.loopSpeed); return (Number.isFinite(n) ? Math.max(2, Math.min(12, n)) : 5) * 1000; }\n  play() {\n    this.stop();\n    this._t = setInterval(() => this.step(1), this.speedMs());\n    this.setState({ playing:true });\n  }\n  stop() { if (this._t) { clearInterval(this._t); this._t = null; } }\n  pause() { this.stop(); this.setState({ playing:false }); }\n  step(d) {\n    const i = LOOP.findIndex(x => x.n === this.state.station);\n    const n = LOOP[(i + d + LOOP.length) % LOOP.length].n;\n    this.setState({ station:n, hover:null });\n  }\n  /* A manual move stops autoplay: the user has taken the wheel. */\n  manual(d) { this.pause(); this.step(d); }\n\n  renderVals() {\n    const st = this.state;\n    const accent = '#f4f4f5';\n    const detailOn = st.detail === null ? (this.props.technicalDetail !== false) : st.detail;\n    const chips = detailOn, showEv = detailOn;\n    const hoverOn = this.props.loopHover !== false;\n    const V = {};\n\n    V.detailOn = detailOn;\n    V.detailLabel = detailOn ? 'Technical detail on' : 'Technical detail off';\n    V.detailBd = detailOn ? 'rgba(188,216,255,.5)' : '#454a55';\n    V.detailBg = detailOn ? 'rgba(157,178,204,.14)' : '#1b1c21';\n    V.detailFg = detailOn ? '#eceae6' : '#cdd5e2';\n    V.toggleDetail = () => this.setState({ detail: !detailOn });\n\n    /* Transport */\n    V.loopPlaying = st.playing;\n    V.loopPlayLabel = st.playing ? '‖ Pause' : '▶ Play';\n    V.loopPlayAria = st.playing ? 'Pause the loop' : 'Play the loop';\n    V.loopPlayBd = st.playing ? 'rgba(188,216,255,.6)' : '#454a55';\n    V.loopPlayBg = st.playing ? 'rgba(157,178,204,.16)' : '#1b1c21';\n    V.loopToggle = () => { if (this.state.playing) this.pause(); else this.play(); };\n    V.loopPrev = () => this.manual(-1);\n    V.loopNext = () => this.manual(1);\n    const li = LOOP.findIndex(x => x.n === st.station);\n    V.loopPosition = 'STATION ' + (li + 1) + ' OF ' + LOOP.length;\n    V.loopRunShow = st.playing ? 'inline-flex' : 'none';\n    V.loopSpeedLabel = (this.speedMs() / 1000) + 'S';\n\n    V.research = RESEARCH.map(g => {\n      const open = !!(st.openR || {})[g.n];\n      return { n:g.n, name:g.name, out:g.out, count:String(g.comps.length) + ' entries',\n        toggle: () => this.setState(x => ({ openR: Object.assign({}, x.openR, { [g.n]: !(x.openR||{})[g.n] }) })),\n        chev: open ? '−' : '+',\n        bd: open ? 'rgba(228,228,232,.32)' : 'rgba(255,255,255,.1)',\n        bg: open ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.015)',\n        nfg: open ? accent : '#a2a2aa', kfg: open ? '#f4f4f5' : '#d7d7da',\n        bar: open ? 'linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f)' : 'transparent',\n        comps: open ? g.comps.map(c => {\n          const t = RTAG[c[2]] || RTAG.OPEN;\n          return { name:c[0], note:c[1], tag:c[2], tfg:t.fg, tbd:t.bd };\n        }) : [] };\n    });\n\n    V.stations = LOOP.map(s => {\n      const on = s.n === st.station, m = MAT[s.mat];\n      return { n:s.n, key:s.key, line:s.line, mat: chips ? s.mat : '—',\n        select: () => this.setState({ station:s.n }),\n        bg: on ? 'rgba(228,228,232,.08)' : 'rgba(255,255,255,.02)',\n        bd: on ? 'rgba(228,228,232,.45)' : 'rgba(255,255,255,.08)',\n        nfg: on ? accent : '#a2a2aa', kfg: on ? '#f4f4f5' : '#c9c7c1',\n        chipfg:m.fg, chipbd:m.bd, chipbg:m.bg,\n        bar: on ? 'linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f,#1e9bff)' : 'transparent',\n        hover: () => { if (hoverOn) this.setState({ hover:s.n }); },\n        unhover: () => { if (hoverOn) this.setState({ hover:null }); } };\n    });\n    /* Hovering previews a station without committing the selection. */\n    const shownN = (hoverOn && st.hover) ? st.hover : st.station;\n    const as = LOOP.find(s => s.n === shownN) || LOOP[2];\n    const nextSt = LOOP[(LOOP.findIndex(s => s.n === as.n) + 1) % LOOP.length];\n    V.hoverShow = (hoverOn && st.hover && st.hover !== st.station) ? 'inline-block' : 'none';\n    V.handoffShow = this.props.loopShowHandoff === false ? 'none' : 'flex';\n    V.activeStation = { n:as.n, key:as.key, detail:as.detail, ev: showEv ? as.ev : '',\n      mat: chips ? as.mat : '—', fg: (MAT[as.mat] || MAT.DESIGNED).fg,\n      fn: as.fn, passes: as.passes, nextLabel: nextSt.n + ' ' + nextSt.key };\n\n    const filt = st.rsFilter || 'all';\n    const shownRs = RSITEMS.filter(i => filt === 'all' || i.topic === filt);\n    const sel = st.rsSel ? RSITEMS.find(i => i.id === st.rsSel) : null;\n    const S = k => RSSTATUS[k] || RSSTATUS.candidate;\n    V.rsTopics = RSTOPICS.map(t => ({ label:t.label, on: filt === t.k,\n      go: () => this.setState({ rsFilter:t.k, rsSel:null }),\n      fg: filt === t.k ? '#f4f4f5' : '#a2a7b0',\n      bar: filt === t.k ? 'linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f)' : 'transparent' }));\n    V.rsItems = shownRs.map(i => {\n      const s = S(i.status), on = st.rsSel === i.id;\n      return { kicker:i.kicker, title:i.title, q:i.q,\n        slabel:s.label, sfg:s.fg, sbd:s.bd, sbg:s.bg,\n        bar: on ? 'linear-gradient(96deg,#1e9bff,#7b5cff 48%,#e0399f)' : 'transparent',\n        open: () => this.setState(s2 => ({ rsSel: s2.rsSel === i.id ? null : i.id })) };\n    });\n    V.rsCount = shownRs.length + ' OF ' + RSITEMS.length + ' ENTRIES';\n    V.rsSelOn = !!sel; V.rsHint = !sel;\n    V.rsDetail = sel ? { title:sel.title, kicker:sel.kicker, q:sel.q, approach:sel.approach,\n      slabel:S(sel.status).label, sfg:S(sel.status).fg, sbd:S(sel.status).bd, sbg:S(sel.status).bg,\n      findings: sel.findings.map(t => ({ t:t })), limits: sel.limits.map(t => ({ t:t })),\n      refs: sel.refs.map(t => ({ t:t })), rel: sel.rel.map(t => ({ t:t })),\n      close: () => this.setState({ rsSel:null }),\n      toRoadmap: () => { try { location.href = 'status.html#horizons'; } catch (e) {} } } : null;\n\n    V.sihreFacts = SIHREFACTS.map(r => ({ k:r.k, v:r.v,\n      fg: r.s === 'supported' ? '#9aab97' : (r.s === 'reported' ? '#c2b49f' : '#a2a2aa'),\n      tag: r.s === 'supported' ? 'SUPPORTED' : (r.s === 'reported' ? 'REPORTED' : 'NOT ESTABLISHED') }));\n    V.sihreArch = SIHREARCH; V.sihreTiers = SIHRETIERS;\n    return V;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
